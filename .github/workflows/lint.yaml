name: Awesome compliance

on:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run Awesome lint
        run: npx awesome-lint@2 README.md

      - name: Check links
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          fail: true
          args: >-
            --user-agent "Mozilla/5.0 Chrome/120"
            --max-concurrency 10
            --host-concurrency 2
            README.md

      - name: Retry link verification
        id: lychee_retry
        if: steps.lychee.outcome == 'failure'
        continue-on-error: true
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          fail: true
          args: >-
            --user-agent "Mozilla/5.0 Chrome/120"
            --max-concurrency 10
            --host-concurrency 2
            README.md

      - name: Fail if link verification still fails
        if: >-
          always() &&
          steps.lychee.outcome == 'failure' &&
          steps.lychee_retry.outcome == 'failure'
        run: exit 1
